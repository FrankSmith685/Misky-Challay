server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Detras de un proxy TLS (Traefik, Caddy, el balanceador del proveedor). Sin esto
  # el backend registraria la IP del contenedor de nginx en vez de la del cliente.
  real_ip_header X-Forwarded-For;
  set_real_ip_from 0.0.0.0/0;

  # Ocultar la version de nginx: es informacion gratis para quien busca exploits.
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Los assets de Vite llevan hash en el nombre: si el contenido cambia, cambia la
  # URL. Por eso se pueden cachear para siempre sin miedo a servir algo viejo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # El index NO se cachea: es lo que apunta a los assets con hash. Si un navegador
  # se queda con un index viejo, pide ficheros que ya no existen y la app no carga.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # El API va por el mismo origen: sin CORS y sin publicar el backend a internet.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Un checkout con la pasarela lenta puede tardar: 60s antes de cortar.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # 8 MB, igual que el limite de express: las imagenes del panel llegan por aqui.
    client_max_body_size 8m;
  }

  # Las imagenes subidas desde el panel, servidas por el backend.
  location /uploads/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public";
  }

  # Enrutado del lado del cliente: cualquier ruta desconocida devuelve el index y
  # React decide. Sin esto, recargar en /menu da un 404 de nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
