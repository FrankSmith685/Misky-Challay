<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/misky-app-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/misky-app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- La tienda es solo modo claro. Sin declararlo, los webviews con oscuro forzado
         invierten por su cuenta selects, barras de scroll y demas controles nativos. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#8b3d59" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Misky Challay" />
    <meta
      name="description"
      content="Crea tu torta con el tamaño, bizcocho y relleno que prefieras. Consulta precios, programa delivery o recojo y sigue tu pedido en Misky Challay."
    />
    <title>Tortas personalizadas y postres | Misky Challay</title>

    <!-- Tarjeta por defecto al compartir. En Peru el canal es WhatsApp: sin estas
         metas, cualquier enlace del sitio viaja como texto pelado. La ficha de
         producto sobrescribe titulo, descripcion e imagen con las del plato. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Misky Challay" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:title" content="Tortas personalizadas y postres | Misky Challay" />
    <meta
      property="og:description"
      content="Crea tu torta con el tamaño, bizcocho y relleno que prefieras. Consulta precios, programa delivery o recojo y sigue tu pedido en Misky Challay."
    />
    <meta property="og:image" content="/brand/misky-challay-square.jpeg" />
    <meta property="og:image:alt" content="Logo de Misky Challay, Pastelería Personalizada" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tortas personalizadas y postres | Misky Challay" />
    <meta
      name="twitter:description"
      content="Crea tu torta con el tamaño, bizcocho y relleno que prefieras. Consulta precios, programa delivery o recojo y sigue tu pedido en Misky Challay."
    />
    <meta name="twitter:image" content="/brand/misky-challay-square.jpeg" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Limpia una vez las caches de versiones anteriores para que el cambio
      // global de identidad visual no siga cargando el tema verde antiguo.
      (() => {
        try {
          const key = 'verde-bowl:theme-cache-v4';
          if (localStorage.getItem(key) === 'done') return;
          localStorage.setItem(key, 'done');
          localStorage.removeItem('vb.theme.tokens.v1');
          localStorage.removeItem('vb.theme.tokens.v2');
          localStorage.removeItem('vb.theme.tokens.v3');
        } catch {
          return;
        }
        const workers = 'serviceWorker' in navigator
          ? navigator.serviceWorker.getRegistrations().then((registrations) =>
              Promise.all(registrations.map((registration) => registration.unregister())))
          : Promise.resolve();
        const storedCaches = 'caches' in window
          ? caches.keys().then((keys) => Promise.all(keys.map((cache) => caches.delete(cache))))
          : Promise.resolve();
        Promise.all([workers, storedCaches]).finally(() => window.location.reload());
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
