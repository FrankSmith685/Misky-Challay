<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- La tienda es solo modo claro. Sin declararlo, los webviews con oscuro forzado
         invierten por su cuenta selects, barras de scroll y demas controles nativos. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#237c52" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Verde Bowl" />
    <meta
      name="description"
      content="Verde Bowl: comida saludable, bowls personalizables, planes con saldo y entrega a tu zona."
    />
    <title>Verde Bowl | Comida saludable a tu medida</title>

    <!-- Tarjeta por defecto al compartir. En Peru el canal es WhatsApp: sin estas
         metas, cualquier enlace del sitio viaja como texto pelado. La ficha de
         producto sobrescribe titulo, descripcion e imagen con las del plato. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Verde Bowl" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:title" content="Verde Bowl | Comida saludable a tu medida" />
    <meta
      property="og:description"
      content="Bowls saludables hechos a tu medida, planes con saldo y entrega en tu zona."
    />
    <meta property="og:image" content="/images/builder/bowl-signature.jpg" />
    <meta property="og:image:alt" content="Bowl saludable de Verde Bowl" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Verde Bowl | Comida saludable a tu medida" />
    <meta
      name="twitter:description"
      content="Bowls saludables hechos a tu medida, planes con saldo y entrega en tu zona."
    />
    <meta name="twitter:image" content="/images/builder/bowl-signature.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
